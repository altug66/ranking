<!DOCTYPE html>
<html>
<head>
  <title>Friend Rankings</title>
  <style>
    body { font-family: Arial; background: #111; color: #fff; text-align: center; }
    .container { margin: 40px auto; width: 80%; max-width: 600px; }
    .friend { padding: 10px; border-bottom: 1px solid #333; }
    .highlight { color: gold; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Friend Rankings</h1>
    <div id="ranking"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");
    const sheetUrl = "YOUR_JSON_FEED_URL";

    fetch(sheetUrl)
      .then(res => res.json())
      .then(data => {
        const entries = data.feed.entry.map(e => ({
          id: e.gsx$id.$t,
          name: e.gsx$name.$t,
          rank: parseInt(e.gsx$rank.$t),
          comment: e.gsx$comment.$t
        })).sort((a,b) => a.rank - b.rank);

        const user = entries.find(f => f.id === userId);
        const rankingDiv = document.getElementById("ranking");

        if (!user) {
          rankingDiv.innerHTML = "<p>User not found!</p>";
          return;
        }

        let visibleEntries = [];
        if (user.rank <= 3) {
          visibleEntries = entries;
        } else {
          visibleEntries = entries.filter(e => e.rank >= user.rank);
        }

        visibleEntries.forEach(f => {
          const div = document.createElement("div");
          div.className = "friend" + (f.id === userId ? " highlight" : "");
          div.textContent = `#${f.rank} ${f.name} — ${f.comment}`;
          rankingDiv.appendChild(div);
        });
      });
  </script>
</body>
</html>
