<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Friend Rankings</title>
</head>
<body>
  <h1>Friend Rankings</h1>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRYDf_vp8N7BdFg638bNEzJhQAIBOBh_qmdbT2IMmmwtuHrSY28vzTk7ChgA2u7ZlTYtCTaj1zgjOj5/pub?output=csv";

    fetch(csvUrl)
      .then(res => res.text())
      .then(text => {
        console.log("CSV fetched successfully!");
        console.log(text);
        document.body.insertAdjacentHTML('beforeend', '<pre>'+text+'</pre>');
      })
      .catch(err => {
        console.error("Failed to fetch CSV:", err);
        document.body.insertAdjacentHTML('beforeend', '<p>Failed to fetch CSV</p>');
      });
  </script>
</body>
</html>
